# Single-wallet test mode (the owner's funding wallet): adds the funding wallet file,
# read-only, and the test ladder. The operator holds funding.lock in $SECRETS_DIR for the
# whole run (FUNDING_LOCK_HELD=true), so no other process opens that wallet meanwhile.
services:
  ladder:
    environment:
      MODE: single-wallet-pinned
      LADDER_FILE: ladders/stagenet.test.json
      FUNDING_WALLET_FILE: /secrets-funding/wallet
      FUNDING_LOCK_HELD: "true"
    volumes:
      - ${FUNDING_WALLET_FILE_HOST:?set FUNDING_WALLET_FILE_HOST to the funding mnemonic file}:/secrets-funding/wallet:ro
